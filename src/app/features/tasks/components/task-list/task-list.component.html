<!-- Card principal de cadastro de tarefas -->
<mat-card class="task-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Lista de tarefas</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Controle de tarefas...</p>

    <!-- Criação/alteração de novas tarefas -->
    <app-task-add [task]="editingTask" (taskSubmit)="onTaskSubmit($event)"></app-task-add>
  </mat-card-content>
</mat-card>

<!-- Campo de busca -->
<mat-card class="search-card" appearance="outlined">
  <mat-card-content>
    <mat-form-field class="search-field" appearance="outline">
      <mat-label>Buscar tarefas</mat-label>
      <input
        matInput
        placeholder="Digite para buscar..."
        [(ngModel)]="searchFilter"
        (input)="onSearch(searchInput.value)"
        #searchInput>
      <mat-icon matSuffix>search</mat-icon>
      <button
        *ngIf="searchFilter"
        matSuffix
        mat-icon-button
        (click)="onClearSearch(); searchInput.value = ''"
        type="button"
        aria-label="Limpar busca">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-content>
</mat-card>

<!-- Card principal de cadastro de tarefas -->
<mat-card class="task-card" appearance="outlined" *ngIf="(tasksPaginated$ | async) as paginatedTasks">

  <!-- Lista de tarefas -->
  <div class="task-list">
    <p>Tarefas:</p>

    <div *ngIf="paginatedTasks.data.length === 0" class="no-tasks">
      <mat-icon>assignment</mat-icon>
      <p>Nenhuma tarefa encontrada. Que tal criar uma nova?</p>
    </div>

    <!--componente do item de cada tarefa-->
    <div *ngFor="let task of paginatedTasks.data">
      <app-task-item [task]="task" (edit)="onEditTask($event)" (delete)="onDeleteTask($event)"
        (toggleComplete)="onToggleComplete($event)">
      </app-task-item>
    </div>
  </div>

  <!-- Componente de paginação -->
  <app-pagination
    [total]="paginatedTasks.total"
    [page]="paginatedTasks.page"
    [perPage]="paginatedTasks.perPage"
    (pageChange)="onPageChange($event)"
    (perPageChange)="onPerPageChange($event)">
  </app-pagination>
</mat-card>
