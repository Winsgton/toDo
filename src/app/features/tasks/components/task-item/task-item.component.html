<!-- Exemplo de item de tarefa -->
<div class="task-item">
  <mat-slide-toggle [checked]="task.feito" (change)="onToggleComplete()"></mat-slide-toggle>
  <div class="task-content">
    <span class="task-text" [class.feito]="task.feito">{{ task.titulo | truncate:30 }}</span>
    <small>Criada: {{task.criadoEm | date: 'dd/MM/yyyy HH:mm'}} <span *ngIf="task.atualizadoEm"> | Atualizada: {{task.atualizadoEm| date: 'dd/MM/yyyy HH:mm'}}</span></small>
  </div>
  <div>
    <button mat-icon-button (click)="onEdit()">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="onDelete()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
